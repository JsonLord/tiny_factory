[OpenAI]
#
# OpenAI or Azure OpenAI Service
#

# Default options: openai, azure, helmholtz-blablador
API_TYPE=openai

# Check Azure's documentation for updates here:
# https://learn.microsoft.com/en-us/azure/ai-services/openai/chatgpt-quickstart?tabs=command-line&pivots=programming-language-python
AZURE_API_VERSION=2023-05-15

#
# Models
#

# The main text generation model, used for agent responses
MODEL=alias-fast

# Reasoning model is used when precise reasoning is required, such as when computing detailed analyses of simulation properties.
REASONING_MODEL=alias-fast

# Embedding model is used for text similarity tasks
EMBEDDING_MODEL=text-embedding-3-small 

#
# Model parameters
#
MAX_TOKENS=32000
TEMPERATURE=1.5
FREQ_PENALTY=0.1
PRESENCE_PENALTY=0.1
TIMEOUT=480
MAX_ATTEMPTS=999
WAITING_TIME=35
EXPONENTIAL_BACKOFF_FACTOR=5

REASONING_EFFORT=high

#
# Caching
#

CACHE_API_CALLS=False
CACHE_FILE_NAME=openai_api_cache.pickle

#
# Other
#

MAX_CONTENT_DISPLAY_LENGTH=4000

[Simulation]

PARALLEL_AGENT_GENERATION=True
PARALLEL_AGENT_ACTIONS=True

# Bounds on parallel persona generation, so that generating populations in the thousands
# doesn't spawn one thread/request per person and overwhelm the LLM API with concurrent calls.
#
# PERSON_GENERATION_MAX_WORKERS: max number of concurrent LLM calls in flight at once during
#     batch person/name generation.
# PERSON_GENERATION_BATCH_SIZE: how many full persona specs to request per LLM call. Amortizes
#     the fixed prompt overhead (rules, examples) across several people. Kept small (5) because
#     each persona spec is a large, richly detailed JSON document, and asking for too many at
#     once risks output truncation and reduced per-persona depth/diversity.
# NAME_GENERATION_BATCH_SIZE: how many names to request per LLM call during sampling-plan setup.
#     Names are tiny compared to full personas, so this can be much larger than the persona batch size.
PERSON_GENERATION_MAX_WORKERS=15
PERSON_GENERATION_BATCH_SIZE=5
NAME_GENERATION_BATCH_SIZE=25

RAI_HARMFUL_CONTENT_PREVENTION=True
RAI_COPYRIGHT_INFRINGEMENT_PREVENTION=True

[Cognition]

ENABLE_MEMORY_CONSOLIDATION=True

MIN_EPISODE_LENGTH=15
MAX_EPISODE_LENGTH=50

EPISODIC_MEMORY_FIXED_PREFIX_LENGTH=10
EPISODIC_MEMORY_LOOKBACK_LENGTH=20

[ActionGenerator]
MAX_ATTEMPTS=2

# This will determine whether any of the following verifications and corrections are performed.
ENABLE_QUALITY_CHECKS=False

ENABLE_REGENERATION=True
ENABLE_DIRECT_CORRECTION=False

ENABLE_QUALITY_CHECK_FOR_PERSONA_ADHERENCE=True
ENABLE_QUALITY_CHECK_FOR_SELFCONSISTENCY=False
ENABLE_QUALITY_CHECK_FOR_FLUENCY=False
ENABLE_QUALITY_CHECK_FOR_SUITABILITY=False
ENABLE_QUALITY_CHECK_FOR_SIMILARITY=False

CONTINUE_ON_FAILURE=True

# 0 to 9
QUALITY_THRESHOLD = 5


[Logging]
LOGLEVEL=DEBUG
# ERROR
# WARNING
# INFO
# DEBUG